[workspace]
resolver = "2"
members = [
    "crates/cfd-core",
    "crates/cfd-ui",
    "crates/cfd-shell",
    "crates/cfd-manager",
    "crates/cfd-installer",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["ppundsh"]
repository = "https://github.com/ppundsh/CustomerFD"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "webp", "gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Ed25519 (minisign) verification of downloaded installers; pure Rust.
minisign-verify = "0.2"
# Ed25519 check of an optional maintainer (YubiKey / FIDO2) release approval; pure Rust.
ed25519-compact = { version = "2", default-features = false }
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
